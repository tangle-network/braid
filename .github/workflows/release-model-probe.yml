name: Release Model Probe

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit of the candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful candidate Release workflow run
        required: true
        type: string

concurrency:
  group: braid-protected-account-proof
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-live
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: candidate-source
          fetch-depth: 0
      - name: Verify candidate source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C candidate-source rev-parse HEAD)" = "$REQUESTED_COMMIT"
          test "$(printf '%s' "$REQUESTED_COMMIT" | wc -c)" = 40
          git -C candidate-source fetch origin main
          git -C candidate-source merge-base --is-ancestor "$REQUESTED_COMMIT" origin/main
      - name: Verify the candidate workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          BRAID_RELEASE_RUN_ID: ${{ inputs.candidate_run_id }}
          BRAID_RELEASE_EXPECT_WORKFLOW: .github/workflows/release.yml
          BRAID_RELEASE_EXPECT_COMMIT: ${{ inputs.commit }}
          BRAID_RELEASE_EXPECT_BRANCH: main
        run: node scripts/release/verify-workflow-run.mjs
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: braid-release-candidate-${{ inputs.commit }}
          path: ${{ runner.temp }}/braid-model-probe
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install and build exact candidate source
        run: |
          cd candidate-source
          pnpm install --frozen-lockfile
          pnpm run build
      - name: One bounded authenticated Gemini task from installed candidate
        env:
          BRAID_LIVE_TANGLE_ENV_JSON: ${{ secrets.BRAID_LIVE_TANGLE_ENV_JSON }}
          BRAID_PROBE_SOURCE: ${{ github.workspace }}/candidate-source
          BRAID_PROBE_ARTIFACT_ROOT: ${{ runner.temp }}/braid-model-probe
          BRAID_PROBE_COMMIT: ${{ inputs.commit }}
        run: node scripts/release/model-probe.mjs
