allowBuilds:
  '@dataiku/uv': true
  better-sqlite3-multiple-ciphers: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
ignoreScripts: false
minimumReleaseAgeExclude:
  # Our own scope installs as soon as it publishes: only our gated, provenance-signed
  # release workflow publishes it. The first matching entry decides, so a per-version
  # entry for this scope would never be read.
  - '@tangle-network/*'
  - '@earendil-works/pi-tui@1.1.0'
overrides:
  zod@<4.6.7: 4.6.7
  undici@>=8.0.0 <8.12.2: 8.12.3
